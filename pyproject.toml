[project]
name = "tidalviz"
version = "0.1.0"
description = "Modular, sandboxed audio visualizer for macOS"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = "MIT"
dependencies = [
    "aiohttp>=3.14.3",
    "catap>=0.6.0",
    "dulwich>=1.2.15",
    "jsonschema>=4.26.0",
    "numpy>=2.5.3",
    "psutil>=7.2.2",
    "pywebview>=6.2.1",
    "watchfiles>=1.3.0",
]

[project.scripts]
tidalviz = "tidalviz.app:main"

[dependency-groups]
dev = [
    "playwright>=1.63.0",
    "pyright>=1.1.414",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-watcher>=0.6.3",
    "ruff>=0.16.9",
]
build = [
    "pyinstaller>=6.22.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tidalviz"]

[tool.uv]
default-groups = ["dev"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["tools/spike"]  # throwaway M1 spike, kept as reference

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]
ignore = ["E501", "RUF001", "RUF002", "RUF003"]  # formatter owns length; en dashes are deliberate

[tool.pyright]
include = ["src/tidalviz"]
strict = ["src/tidalviz"]
pythonVersion = "3.12"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
  "live: needs real system audio and capture permission (deselect with -m 'not live')",
  "e2e: Playwright end-to-end",
]
