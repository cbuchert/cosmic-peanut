name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  python:
    runs-on: macos-latest  # arm64
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked
      - run: uv run ruff check . && uv run ruff format --check .
      - run: uv run pyright
      - run: uv run pytest -m "not live and not e2e and not perf"
      - name: perf checks (informational on shared runners)
        continue-on-error: true
        run: uv run pytest -m perf

  python-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked
      - run: uv run ruff check . && uv run ruff format --check .
      # catap_source.py can't resolve `catap` off macOS; the macOS job type-checks it
      - run: uv run pyright -p pyrightconfig.linux.json
      - run: uv run pytest -m "not live and not e2e and not perf"
      - name: perf checks (informational on shared runners)
        continue-on-error: true
        run: uv run pytest -m perf

  web:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  e2e:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked
      - run: uv run playwright install webkit
      - run: uv run pytest -m e2e

  e2e-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked
      # --with-deps: Playwright's WebKit needs Ubuntu's libraries (installed via apt)
      - run: uv run playwright install --with-deps webkit
      - run: uv run pytest -m e2e
